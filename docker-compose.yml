services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jewel_essence}
      POSTGRES_USER: ${POSTGRES_USER:-jewel_essence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://jewel_essence:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/jewel_essence
      MEDIA_ROOT: /data/media
    ports:
      - "8000:8000"
    volumes:
      - media-data:/data/media
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - api

  worker:
    build: ./worker
    environment:
      SCRAPER_ENABLED: "true"
      SCRAPER_INTERVAL_SECONDS: ${SCRAPER_INTERVAL_SECONDS:-86400}
      DATABASE_URL: postgresql+psycopg://jewel_essence:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/jewel_essence
      MEDIA_ROOT: /data/media
    volumes:
      - media-data:/data/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
