services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_CORS_ORIGINS: https://${ROOT_DOMAIN}
      MEDIA_ROOT: /data/media
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media-data:/data/media
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

  worker:
    build: ./worker
    environment:
      SCRAPER_ENABLED: ${SCRAPER_ENABLED:-true}
      SCRAPER_INTERVAL_SECONDS: ${SCRAPER_INTERVAL_SECONDS:-86400}
      DATABASE_URL: ${DATABASE_URL}
      MEDIA_ROOT: /data/media
    volumes:
      - media-data:/data/media

volumes:
  media-data:
